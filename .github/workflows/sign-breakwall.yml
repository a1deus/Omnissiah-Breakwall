name: Build and sign Breakwall

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, 1.0.2)'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sign-launcher:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build launcher from source
        id: build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -cnotmatch '\A(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\z') {
            throw 'Enter a version such as 1.0.2.'
          }
          $version = "$env:RELEASE_VERSION.0"
          & ./src/build.ps1 -Version $version
          $metadata = (Get-Item -LiteralPath './Omnissiah Breakwall.exe').VersionInfo
          if ($metadata.ProductName -cne 'Omnissiah Breakwall' -or
              $metadata.ProductVersion -cne $version -or $metadata.FileVersion -cne $version) {
            throw 'Unexpected launcher metadata.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned launcher
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-breakwall
          path: 'Omnissiah Breakwall.exe'
          if-no-files-found: error

      - name: Sign launcher
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.build.outputs.version) }}

      - name: Verify signed launcher
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath './signed/Omnissiah Breakwall.exe'
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne 'SignPath Foundation' -or
              !$signature.TimeStamperCertificate) {
            throw "Expected a valid, timestamped SignPath Foundation signature. Status: $($signature.Status)"
          }

      - name: Upload signed launcher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-breakwall-${{ inputs.version }}
          path: 'signed/Omnissiah Breakwall.exe'
          if-no-files-found: error
